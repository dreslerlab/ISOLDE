# Pages CMS configuration: https://pagescms.org/docs/configuration/
#
# Mirrors the content schemas in src/content.config.ts and src/lib/site.ts. Every field the site reads is
# declared here, so saving from the CMS never drops one; tests/unit/pages-cms.test.ts checks this.
# The build validates everything again, so a bad value fails the deploy instead of going live.

media:
  # Team photos sit next to the team files. Astro resolves `photos/x.png` relative to the .md file.
  - name: team-photos
    label: Team photos
    input: src/content/team/photos
    output: photos
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe

components:
  # Reusable field definitions. A field using `component:` must still give its own `name`.
  title:
    label: Page heading
    type: string
    required: true
  description:
    label: Search engine description
    description: Shown by search engines and in link previews. 160 characters at most.
    type: string
    required: true
    options:
      maxlength: 160
  body:
    label: Text
    description: 'Links to other pages must start with /ISOLDE/, e.g. /ISOLDE/faq/'
    type: rich-text
    options:
      media: false
  order:
    label: Position
    description: 1 = first.
    type: number
    required: true
    options: { min: 1 }
  email:
    label: Email
    type: string
    pattern:
      regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      message: 'Enter an email address, e.g. isolde@donders.ru.nl'

content:
  - name: pages
    label: Pages
    type: group
    items:
      - name: about
        label: About (home page)
        type: file
        path: src/content/pages/about.md
        format: yaml-frontmatter
        fields:
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: body, component: body }

      - name: research
        label: Research
        type: file
        path: src/content/pages/research.md
        format: yaml-frontmatter
        fields:
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: body, component: body }

      - name: participate
        label: Participate
        type: file
        path: src/content/pages/participate.md
        format: yaml-frontmatter
        fields:
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: body, component: body }
          - name: discord
            label: Discord section
            description: The invite link itself is in Site settings.
            type: object
            required: true
            fields:
              - { name: heading, label: Heading, type: string, required: true }
              - { name: intro, label: Introduction, type: text, required: true }
              - { name: dreamersHeading, label: Dreamers heading, type: string, required: true }
              - { name: forDreamers, label: Points for dreamers, type: text, required: true, list: true }
              - { name: researchersHeading, label: Researchers heading, type: string, required: true }
              - { name: forResearchers, label: Points for researchers, type: text, required: true, list: true }
              - { name: joinHeading, label: '"How to join" heading', type: string, required: true }
              - { name: joinText, label: '"How to join" text', type: text, required: true }

      - name: faq-page
        label: FAQ (page intro)
        type: file
        path: src/content/pages/faq.md
        format: yaml-frontmatter
        fields:
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: body, component: body }

      - name: contact
        label: Contact
        type: file
        path: src/content/pages/contact.md
        format: yaml-frontmatter
        fields:
          - { name: title, component: title }
          - { name: description, component: description }
          - { name: body, component: body }
          - name: address
            label: Postal address
            type: object
            fields:
              - { name: heading, label: Heading, type: string, required: true }
              - { name: lines, label: Address lines, type: string, required: true, list: true }

  - name: faq
    label: FAQ questions
    type: collection
    path: src/content/faq
    format: yaml-frontmatter
    filename:
      # The file name becomes the question's link anchor: /ISOLDE/faq/#<file-name>.
      template: '{question}.md'
      field: create
    view:
      fields: [question, order]
      primary: question
      sort: [order, question]
      default: { sort: order, order: asc }
    fields:
      - { name: question, label: Question, type: string, required: true }
      - { name: order, component: order }
      - { name: body, label: Answer, type: rich-text, required: true, options: { media: false } }

  - name: team
    label: Study coordinators
    type: collection
    path: src/content/team
    format: yaml-frontmatter
    exclude: [photos]
    filename:
      template: '{name}.md'
      field: create
    view:
      fields: [name, affiliation, order]
      primary: name
      sort: [order, name]
      default: { sort: order, order: asc }
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: affiliation, label: Affiliation, type: string, required: true }
      - name: photo
        label: Photo
        description: Square, at least 320 × 320 px.
        type: image
        required: true
        options: { media: team-photos }
      - name: photoAlt
        label: Photo description
        description: 'For screen readers. Leave empty to use "Portrait of <name>".'
        type: string
      - name: role
        label: Role
        type: select
        default: coordinator
        options:
          values:
            - { name: coordinator, label: Coordinator (shown on Contact) }
            - { name: researcher, label: Researcher (not shown) }
      - { name: email, component: email }
      - { name: order, component: order }

  - name: sites
    label: Study sites
    type: collection
    path: src/content/sites
    format: yaml-frontmatter
    exclude: [.gitkeep]
    filename:
      template: '{city}.md'
      field: create
    view:
      fields: [city, country, institution, recruiting]
      primary: city
      sort: [country, city]
      default: { sort: country, order: asc }
    fields:
      - { name: city, label: City, type: string, required: true }
      - { name: country, label: Country, type: string, required: true }
      - { name: institution, label: Institution, type: string }
      - name: lat
        label: Latitude
        description: 'Decimal degrees, north positive, e.g. 51.8425 for Nijmegen. Right-click the place on openstreetmap.org and choose "Show address".'
        type: number
        required: true
        options: { min: -90, max: 90 }
      - name: lon
        label: Longitude
        description: 'Decimal degrees, east positive, e.g. 5.8528 for Nijmegen.'
        type: number
        required: true
        options: { min: -180, max: 180 }
      - { name: contactEmail, component: email, label: Contact email }
      - name: recruiting
        label: Recruiting participants
        type: boolean
        default: true
      - { name: body, label: Map popup text, type: rich-text, options: { media: false } }

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: studyTitle, label: Study title, type: string, required: true }
      - { name: shortName, label: Short name, type: string, required: true }
      - { name: contactEmail, component: email, label: Contact email, required: true }
      - { name: footerText, label: Footer text, type: text, required: true }
      - name: discordInviteUrl
        label: Discord invite link
        description: 'Shown as the "Join our Discord server" button on the Participate page. Create the invite in Discord with "Expire after: Never".'
        type: string
        required: true
        pattern:
          regex: '^https://(discord\.gg|discord\.com/invite)/[A-Za-z0-9-]+/?$'
          message: 'Use a Discord invite link, e.g. https://discord.gg/abc123'
